# =============================================================================
# Local AI Email Security Agent — Docker Compose
# =============================================================================
#
# Quick start:
#   1. Copy .env.example to .env and fill in your credentials
#   2. docker compose build
#   3. docker compose up
#
# Run in background:
#   docker compose up -d
#
# Follow logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down
# =============================================================================

services:
  email-agent:
    # -------------------------------------------------------------------------
    # Build the image from the local Dockerfile
    # -------------------------------------------------------------------------
    build:
      context: .
      dockerfile: Dockerfile

    # -------------------------------------------------------------------------
    # Container name for easy reference in docker exec / docker logs
    # -------------------------------------------------------------------------
    container_name: email-security-agent

    # -------------------------------------------------------------------------
    # Restart policy: keeps the container running unless you explicitly stop it
    # -------------------------------------------------------------------------
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Environment variables
    # Load all variables from .env file automatically.
    # Variables defined here override those in .env.
    #
    # OLLAMA_BASE_URL is set to host.docker.internal so the container can reach
    # Ollama running on the HOST machine (not inside Docker).
    # On Linux you may need to add extra_hosts below if host.docker.internal
    # is not available by default.
    # -------------------------------------------------------------------------
    env_file:
      - .env
    environment:
      # Override the Ollama URL to use Docker host networking
      # This allows the container to reach Ollama on your host machine
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    # -------------------------------------------------------------------------
    # Persistent volume for logs
    # Logs written inside the container are preserved on your host machine
    # -------------------------------------------------------------------------
    volumes:
      - ./logs:/app/logs

    # -------------------------------------------------------------------------
    # Linux compatibility: map host.docker.internal to the Docker host IP
    # This is automatically available on Windows/macOS Docker Desktop.
    # On Linux (native Docker), uncomment the lines below:
    # -------------------------------------------------------------------------
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # -------------------------------------------------------------------------
    # Default command: continuous watch mode
    # Override at runtime for other modes:
    #   docker compose run email-agent python main.py --scan
    #   docker compose run email-agent python main.py --test
    #   docker compose run email-agent python main.py --check
    # -------------------------------------------------------------------------
    command: ["python", "main.py", "--scan", "--watch"]

    # -------------------------------------------------------------------------
    # Resource limits (optional — uncomment to constrain memory/CPU)
    # -------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256m
    #       cpus: "0.5"
